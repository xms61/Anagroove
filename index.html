<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anagroove · The music crossword</title>
    <meta name="theme-color" content="#0a0e1a" />
    <!-- Sets html[data-theme] from the saved settings before anything paints -->
    <script src="/theme-boot.js"></script>
    <!-- Page colour per theme before the stylesheet loads, so there is no light flash -->
    <style>
      html, body { background-color: #0a0e1a; color: #e8eeff; }
      html[data-theme='berlin'], html[data-theme='berlin'] body { background-color: #131313; }
      html[data-theme='vinyl'], html[data-theme='vinyl'] body { background-color: #16110d; }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
