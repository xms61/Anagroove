name: Manual Test, Lint, Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.1.0; blank uses package.json version)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean
      run_prompt_suite:
        description: 'Run the live multi-prompt crossword verification suite (14 genres & constraints)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  validate-and-release:
    name: Lint, Test, Docker Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run automated test suite (192 tests)
        run: npm test

      - name: Run multi-prompt crossword test suite (14 prompts)
        if: ${{ inputs.run_prompt_suite }}
        run: npm run test:prompts

      - name: Determine release version tag
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG="v${PKG_VERSION}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v$TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved release tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: spotyspice:${{ steps.get_version.outputs.tag }},spotyspice:latest

      - name: Extract Changelog Section
        id: changelog
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          CLEAN_VER="${TAG#v}"
          python3 -c "
          import re, sys
          ver = '${CLEAN_VER}'
          try:
              with open('CHANGELOG.md', 'r') as f:
                  content = f.read()
              pattern = rf'## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
                  with open('release_notes.md', 'w') as out:
                      out.write(notes)
                  sys.exit(0)
          except Exception:
              pass
          with open('release_notes.md', 'w') as out:
              out.write('SpotySpice Release ' + '${TAG}')
          "
          echo "Release notes prepared in release_notes.md"

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push Git Tag
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "SpotySpice ${{ steps.get_version.outputs.tag }}"
          body_path: release_notes.md
          prerelease: ${{ inputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
