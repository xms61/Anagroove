services:
  anagroove:
    build: .
    container_name: anagroove
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Behind a reverse proxy: its hop count, so rate limits see each player's IP instead of the proxy's
      # - TRUST_PROXY=1
      # Other sites allowed to call the API (the page's own origin is always allowed)
      # - CORS_ALLOWED_ORIGINS=https://example.com
    volumes:
      - spotyspice_data:/app/server/data
      # Anime OP/ED clips from `npm run anime:samples`, served at /audio/anime (not in the image)
      - ./data/anime_samples:/app/data/anime_samples:ro

volumes:
  spotyspice_data:
